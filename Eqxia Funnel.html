<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eqxia — Pipeline CRM (wireframe)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #EDE8DF;
      color: #0E1013;
      font-family: "Inter Tight", -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; border: none; background: none; }
    input, textarea, select { font: inherit; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(14,16,19,0.18); border-radius: 99px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .wf-hatch {
      background-image: repeating-linear-gradient(
        135deg, rgba(14,16,19,0.055) 0, rgba(14,16,19,0.055) 1px,
        transparent 1px, transparent 8px
      );
    }

    /* Layout */
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* Topbar */
    .topbar {
      display: flex; align-items: center; gap: 20px;
      padding: 0 24px; height: 52px;
      border-bottom: 1px solid rgba(14,16,19,0.12);
      flex-shrink: 0;
    }
    .topbar-logo {
      font-family: "Instrument Serif", serif;
      font-size: 16px; font-style: italic;
      letter-spacing: 0.01em;
      color: #0E1013;
    }
    .topbar-sep {
      width: 1px; height: 20px;
      background: rgba(14,16,19,0.15);
    }
    .topbar-title {
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.04em; color: #53585F;
      text-transform: uppercase;
    }
    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; font-size: 12px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase;
      border: 1px solid rgba(14,16,19,0.22);
      color: #0E1013; transition: all 0.12s;
    }
    .btn:hover { background: rgba(14,16,19,0.06); }
    .btn-primary { background: #0E1013; color: #EDE8DF; border-color: #0E1013; }
    .btn-primary:hover { background: #274A4F; border-color: #274A4F; }

    /* Stats bar */
    .stats-bar {
      display: flex; align-items: stretch; gap: 0;
      border-bottom: 1px solid rgba(14,16,19,0.12);
      flex-shrink: 0; overflow-x: auto;
    }
    .stat-cell {
      display: flex; flex-direction: column; justify-content: center;
      padding: 10px 24px; min-width: 150px;
      border-right: 1px solid rgba(14,16,19,0.1);
    }
    .stat-cell:last-child { border-right: none; }
    .stat-label {
      font-size: 10px; font-weight: 500; letter-spacing: 0.14em;
      text-transform: uppercase; color: #53585F; margin-bottom: 2px;
    }
    .stat-value {
      font-family: "JetBrains Mono", monospace;
      font-size: 18px; font-weight: 400; color: #0E1013;
    }
    .stat-sub {
      font-size: 10px; color: #53585F; margin-top: 1px;
    }
    .stat-teal { color: #274A4F; }

    /* Filters */
    .filters-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 24px;
      border-bottom: 1px solid rgba(14,16,19,0.1);
      flex-shrink: 0; overflow-x: auto;
    }
    .filter-tag {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; font-size: 11px; font-weight: 500;
      letter-spacing: 0.05em; text-transform: uppercase;
      border: 1px solid rgba(14,16,19,0.2); color: #53585F;
      cursor: pointer; transition: all 0.12s;
    }
    .filter-tag:hover { border-color: #0E1013; color: #0E1013; }
    .filter-tag.active {
      background: #0E1013; color: #EDE8DF;
      border-color: #0E1013;
    }
    .filter-tag.teal-active {
      background: #A7C9CF; color: #0E1013;
      border-color: #A7C9CF;
    }
    .filters-sep { width: 1px; height: 20px; background: rgba(14,16,19,0.12); flex-shrink: 0; }

    /* Kanban */
    .kanban-wrap {
      flex: 1; display: flex; overflow: hidden;
    }
    .kanban {
      flex: 1; display: flex; gap: 0;
      overflow-x: auto; padding: 0;
    }

    /* Stage column */
    .stage-col {
      display: flex; flex-direction: column;
      min-width: 260px; width: 260px;
      border-right: 1px solid rgba(14,16,19,0.1);
      flex-shrink: 0; height: 100%;
    }
    .stage-col:last-child { border-right: none; }
    .stage-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(14,16,19,0.1);
      flex-shrink: 0;
    }
    .stage-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }
    .stage-name {
      font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .stage-count {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px; color: #53585F;
    }
    .stage-bar-track {
      height: 2px; background: rgba(14,16,19,0.1); width: 100%;
    }
    .stage-bar-fill {
      height: 100%; background: #A7C9CF;
      transition: width 0.3s ease;
    }
    .stage-total {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px; color: #274A4F; margin-top: 5px;
    }

    .stage-cards {
      flex: 1; overflow-y: auto;
      padding: 10px 10px;
      display: flex; flex-direction: column; gap: 7px;
    }

    /* Deal card */
    .deal-card {
      background: #F5F0E8;
      border: 1px solid rgba(14,16,19,0.13);
      padding: 12px 13px;
      cursor: pointer;
      transition: all 0.12s;
      position: relative;
    }
    .deal-card:hover {
      border-color: rgba(14,16,19,0.3);
      box-shadow: 0 2px 8px rgba(14,16,19,0.07);
    }
    .deal-card.selected {
      border-color: #274A4F;
      box-shadow: 0 0 0 2px rgba(167,201,207,0.4);
    }
    .deal-card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 8px;
      margin-bottom: 6px;
    }
    .deal-client {
      font-size: 13px; font-weight: 600;
      color: #0E1013; line-height: 1.3;
    }
    .deal-value {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px; font-weight: 500;
      color: #274A4F; white-space: nowrap;
    }
    .deal-contact {
      font-size: 11px; color: #53585F; margin-bottom: 8px;
    }
    .deal-meta {
      display: flex; align-items: center; gap: 6px;
      flex-wrap: wrap;
    }
    .deal-tag {
      display: inline-block; padding: 2px 6px;
      font-size: 10px; font-weight: 500; letter-spacing: 0.06em;
      text-transform: uppercase; background: rgba(14,16,19,0.07);
      color: #53585F;
    }
    .deal-tag.source-cold { background: rgba(14,16,19,0.05); }
    .deal-tag.source-ref { background: rgba(167,201,207,0.25); color: #274A4F; }
    .deal-tag.source-in { background: rgba(167,201,207,0.15); }
    .deal-days {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px; color: #53585F; margin-left: auto;
    }
    .deal-days.overdue { color: #8B3A3A; }
    .deal-prob-bar {
      height: 2px; background: rgba(14,16,19,0.08);
      margin-top: 9px; width: 100%;
    }
    .deal-prob-fill {
      height: 100%; background: #A7C9CF;
    }

    /* Detail panel */
    .detail-panel {
      width: 360px; flex-shrink: 0;
      border-left: 1px solid rgba(14,16,19,0.12);
      display: flex; flex-direction: column;
      background: #EDE8DF;
      overflow: hidden;
      transition: width 0.2s ease;
    }
    .detail-panel.collapsed { width: 0; border-left: none; }
    .detail-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(14,16,19,0.1);
      flex-shrink: 0;
    }
    .detail-client-name {
      font-family: "Instrument Serif", serif;
      font-size: 20px; font-style: italic; color: #0E1013;
    }
    .close-btn {
      width: 28px; height: 28px; display: flex; align-items: center;
      justify-content: center; color: #53585F;
      border: 1px solid rgba(14,16,19,0.15);
      font-size: 16px; line-height: 1;
    }
    .close-btn:hover { border-color: #0E1013; color: #0E1013; }

    .detail-body { flex: 1; overflow-y: auto; padding: 16px 18px; }

    .detail-section { margin-bottom: 20px; }
    .detail-section-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.16em;
      text-transform: uppercase; color: #53585F;
      margin-bottom: 10px; padding-bottom: 6px;
      border-bottom: 1px solid rgba(14,16,19,0.1);
    }
    .detail-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 5px 0; font-size: 12px;
    }
    .detail-row-label { color: #53585F; }
    .detail-row-value {
      font-weight: 500; text-align: right; color: #0E1013;
    }
    .detail-row-value.mono {
      font-family: "JetBrains Mono", monospace; font-weight: 400;
    }
    .detail-big-value {
      font-family: "JetBrains Mono", monospace;
      font-size: 28px; color: #274A4F; margin-bottom: 4px;
    }

    .stage-pills { display: flex; gap: 0; margin-bottom: 16px; overflow-x: auto; }
    .stage-pill {
      flex: 1; padding: 6px 4px; text-align: center;
      font-size: 9px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; border: 1px solid rgba(14,16,19,0.12);
      margin-right: -1px; color: #53585F;
      cursor: pointer; white-space: nowrap; min-width: fit-content;
    }
    .stage-pill.past { background: #A7C9CF; color: #0E1013; border-color: #A7C9CF; }
    .stage-pill.current { background: #0E1013; color: #EDE8DF; border-color: #0E1013; }

    .note-area {
      width: 100%; resize: vertical; min-height: 80px;
      background: rgba(14,16,19,0.04); border: 1px solid rgba(14,16,19,0.15);
      padding: 10px; font-size: 12px; color: #0E1013;
      outline: none;
    }
    .note-area:focus { border-color: #A7C9CF; }

    .timeline-item {
      display: flex; gap: 10px; padding: 6px 0;
      border-bottom: 1px solid rgba(14,16,19,0.07);
      font-size: 12px;
    }
    .timeline-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #A7C9CF; flex-shrink: 0; margin-top: 4px;
    }
    .timeline-date {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px; color: #53585F; white-space: nowrap;
    }
    .timeline-text { color: #0E1013; flex: 1; }

    /* Lost/won overlay on card */
    .deal-card.won .deal-card-inner { opacity: 0.7; }
    .deal-card.won::before {
      content: "WON"; position: absolute; top: 6px; right: 6px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
      padding: 2px 6px; background: #274A4F; color: #EDE8DF;
    }
    .deal-card.lost::before {
      content: "PERDU"; position: absolute; top: 6px; right: 6px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
      padding: 2px 6px; background: rgba(14,16,19,0.5); color: #EDE8DF;
    }

    /* Tweaks panel */
    #tweaks-panel {
      position: fixed; right: 16px; bottom: 16px;
      background: #0E1013; color: #EDE8DF;
      border: 1px solid #274A4F; padding: 14px 16px;
      font-family: "JetBrains Mono", monospace; font-size: 11px;
      letter-spacing: 0.04em; min-width: 220px;
      display: none; z-index: 9999;
    }
    #tweaks-panel.active { display: block; }
    #tweaks-panel h4 {
      margin: 0 0 12px; font-family: "Inter Tight", sans-serif;
      font-size: 11px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.18em; color: #A7C9CF;
    }
    #tweaks-panel .tw-row { margin-bottom: 12px; }
    #tweaks-panel .tw-row label {
      display: block; margin-bottom: 6px; opacity: 0.6;
      text-transform: uppercase; font-size: 10px;
    }
    #tweaks-panel .tw-opts { display: flex; gap: 4px; }
    #tweaks-panel .tw-opts button {
      flex: 1; padding: 7px 8px; background: transparent;
      border: 1px solid #274A4F; color: #EDE8DF;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    #tweaks-panel .tw-opts button.active {
      background: #A7C9CF; color: #0E1013; border-color: #A7C9CF;
    }
    #tweaks-toggle {
      position: fixed; right: 16px; bottom: 16px; z-index: 10000;
      width: 32px; height: 32px; background: #0E1013; color: #EDE8DF;
      border: 1px solid #274A4F; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    #tweaks-panel.active + #tweaks-toggle { bottom: calc(16px + var(--panel-h, 200px) + 8px); }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <div id="tweaks-panel">
    <h4>Tweaks</h4>
    <div class="tw-row">
      <label>Thème</label>
      <div class="tw-opts" data-key="theme">
        <button data-value="ivory" class="active">Ivory</button>
        <button data-value="ink">Ink</button>
      </div>
    </div>
    <div class="tw-row">
      <label>Affichage</label>
      <div class="tw-opts" data-key="view">
        <button data-value="kanban" class="active">Kanban</button>
        <button data-value="list">Liste</button>
      </div>
    </div>
  </div>
  <button id="tweaks-toggle" onclick="document.getElementById('tweaks-panel').classList.toggle('active')">⊞</button>

  <script>
    // Tweaks panel button logic
    document.getElementById('tweaks-panel').addEventListener('click', function(e) {
      if (e.target.tagName === 'BUTTON' && e.target.dataset.value) {
        const group = e.target.closest('[data-key]');
        group.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const key = group.dataset.key;
        const val = e.target.dataset.value;
        if (key === 'theme') {
          document.body.style.background = val === 'ink' ? '#0E1013' : '#EDE8DF';
          document.body.style.color = val === 'ink' ? '#EDE8DF' : '#0E1013';
        }
      }
    });
  </script>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // ─── Data ───────────────────────────────────────────────────────────────
    const STAGES = [
      { id: 'prospection',  label: 'Prospection',  prob: 10, color: '#A7C9CF' },
      { id: 'qualification',label: 'Qualification', prob: 25, color: '#8FBDC4' },
      { id: 'proposition',  label: 'Proposition',  prob: 50, color: '#6AA5AE' },
      { id: 'negociation',  label: 'Négociation',  prob: 75, color: '#3D848E' },
      { id: 'closing',      label: 'Closing',      prob: 90, color: '#274A4F' },
    ];

    const DEALS_INIT = [
      { id: 1,  client: 'Sonepar',          contact: 'Damien Kraft',      value: 42000, stage: 'proposition',   source: 'referral', owner: 'CE', days: 8,  prob: 55, tags: ['Formation'], note: 'Atelier leadership - 2 groupes de 12 personnes.' },
      { id: 2,  client: 'Crédit Agricole',  contact: 'Lucie Frommer',     value: 68000, stage: 'negociation',   source: 'inbound',  owner: 'JB', days: 14, prob: 70, tags: ['Coaching'], note: 'Programme de coaching manager. Réunion de closing planifiée.' },
      { id: 3,  client: 'Decathlon Group',  contact: 'Thomas Barraud',    value: 31000, stage: 'qualification', source: 'cold',     owner: 'CE', days: 5,  prob: 20, tags: ['Formation'], note: '' },
      { id: 4,  client: 'Michelin',         contact: 'Sara Oliveira',     value: 95000, stage: 'closing',       source: 'referral', owner: 'JB', days: 3,  prob: 88, tags: ['Conseil'], note: 'Transformation org. Contrat en lecture.' },
      { id: 5,  client: 'Renault Group',    contact: 'Pierre Dumont',     value: 120000,stage: 'proposition',   source: 'inbound',  owner: 'EM', days: 21, prob: 45, tags: ['Conseil', 'Formation'], note: 'Gros compte — pipeline long.' },
      { id: 6,  client: 'BNP Paribas',      contact: 'Claire Morin',      value: 55000, stage: 'prospection',   source: 'cold',     owner: 'EM', days: 2,  prob: 10, tags: ['Coaching'], note: '' },
      { id: 7,  client: 'Orange Business',  contact: 'Marc Levi',         value: 28000, stage: 'qualification', source: 'inbound',  owner: 'CE', days: 9,  prob: 30, tags: ['Formation'], note: 'Budget confirmé Q3.' },
      { id: 8,  client: 'Veolia',           contact: 'Nathalie Roux',     value: 74000, stage: 'negociation',   source: 'referral', owner: 'JB', days: 18, prob: 65, tags: ['Conseil'], note: '' },
      { id: 9,  client: 'LVMH',             contact: 'Antoine Bernard',   value: 150000,stage: 'prospection',   source: 'referral', owner: 'CE', days: 1,  prob: 10, tags: ['Formation', 'Conseil'], note: 'Introduction via Julien Masson.' },
      { id: 10, client: 'Airbus France',    contact: 'Sophie Girard',     value: 47000, stage: 'closing',       source: 'inbound',  owner: 'EM', days: 6,  prob: 92, tags: ['Formation'], note: 'Dernier avenant signé, en attente PO.' },
      { id: 11, client: 'EDF',              contact: 'Romain Duval',      value: 38000, stage: 'proposition',   source: 'cold',     owner: 'JB', days: 30, prob: 35, tags: ['Coaching'], note: 'Dossier compliqué — interlocuteur peu disponible.' },
      { id: 12, client: 'Bouygues Telecom', contact: 'Chloé Martin',      value: 22000, stage: 'qualification', source: 'inbound',  owner: 'EM', days: 4,  prob: 25, tags: ['Formation'], note: '' },
    ];

    const TIMELINE_SAMPLE = [
      { date: '2026-04-28', text: 'Appel de suivi — proposition envoyée' },
      { date: '2026-04-22', text: 'Réunion découverte — besoins clarifiés' },
      { date: '2026-04-10', text: 'Premier contact — prise de brief' },
      { date: '2026-03-31', text: 'Lead entrant — formulaire site' },
    ];

    const fmt = (n) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);
    const fmtK = (n) => n >= 1000 ? `${(n/1000).toFixed(0)} k€` : `${n} €`;

    // ─── Components ─────────────────────────────────────────────────────────
    function DealCard({ deal, selected, onClick }) {
      const sourceClass = { cold: 'source-cold', referral: 'source-ref', inbound: 'source-in' }[deal.source] || '';
      const srcLabel = { cold: 'Cold', referral: 'Référence', inbound: 'Inbound' }[deal.source];
      const overdue = deal.days > 20;
      return (
        <div
          className={`deal-card ${selected ? 'selected' : ''}`}
          onClick={onClick}
        >
          <div className="deal-card-top">
            <div className="deal-client">{deal.client}</div>
            <div className="deal-value">{fmtK(deal.value)}</div>
          </div>
          <div className="deal-contact">{deal.contact}</div>
          <div className="deal-meta">
            <span className={`deal-tag ${sourceClass}`}>{srcLabel}</span>
            {deal.tags.map(t => <span key={t} className="deal-tag">{t}</span>)}
            <span className={`deal-days ${overdue ? 'overdue' : ''}`}>{deal.days}j</span>
          </div>
          <div className="deal-prob-bar">
            <div className="deal-prob-fill" style={{ width: `${deal.prob}%` }} />
          </div>
        </div>
      );
    }

    function StageColumn({ stage, deals, selectedId, onSelect, totalPipeline }) {
      const stageTotal = deals.reduce((s, d) => s + d.value, 0);
      const pct = totalPipeline > 0 ? (stageTotal / totalPipeline) * 100 : 0;
      return (
        <div className="stage-col">
          <div className="stage-header">
            <div className="stage-top">
              <span className="stage-name">{stage.label}</span>
              <span className="stage-count">{deals.length}</span>
            </div>
            <div className="stage-bar-track">
              <div className="stage-bar-fill" style={{ width: `${pct}%` }} />
            </div>
            <div className="stage-total">{fmtK(stageTotal)}</div>
          </div>
          <div className="stage-cards crm-scroll">
            {deals.length === 0 && (
              <div className="wf-hatch" style={{
                height: 80, border: '1px dashed rgba(14,16,19,0.15)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                color: 'rgba(14,16,19,0.25)', fontSize: 11, letterSpacing: '0.08em'
              }}>VIDE</div>
            )}
            {deals.map(d => (
              <DealCard
                key={d.id}
                deal={d}
                selected={selectedId === d.id}
                onClick={() => onSelect(d)}
              />
            ))}
          </div>
        </div>
      );
    }

    function DetailPanel({ deal, onClose }) {
      const stageIdx = STAGES.findIndex(s => s.id === deal.stage);

      return (
        <div className="detail-panel">
          <div className="detail-header">
            <div>
              <div className="detail-client-name">{deal.client}</div>
              <div style={{ fontSize: 11, color: '#53585F', marginTop: 2 }}>{deal.contact}</div>
            </div>
            <button className="close-btn" onClick={onClose}>×</button>
          </div>
          <div className="detail-body crm-scroll">
            {/* Stage progress */}
            <div style={{ marginBottom: 16 }}>
              <div className="stage-pills">
                {STAGES.map((s, i) => (
                  <div
                    key={s.id}
                    className={`stage-pill ${i < stageIdx ? 'past' : i === stageIdx ? 'current' : ''}`}
                  >{s.label}</div>
                ))}
              </div>
            </div>

            {/* Valeur */}
            <div className="detail-section">
              <div className="detail-big-value">{fmt(deal.value)}</div>
              <div style={{ fontSize: 11, color: '#53585F' }}>
                Pondérée : {fmt(Math.round(deal.value * deal.prob / 100))}
                <span style={{ marginLeft: 8, fontFamily: 'JetBrains Mono', fontSize: 10 }}>({deal.prob}%)</span>
              </div>
              <div className="deal-prob-bar" style={{ marginTop: 8 }}>
                <div className="deal-prob-fill" style={{ width: `${deal.prob}%` }} />
              </div>
            </div>

            {/* Infos */}
            <div className="detail-section">
              <div className="detail-section-label">Informations</div>
              <div className="detail-row">
                <span className="detail-row-label">Responsable</span>
                <span className="detail-row-value">{deal.owner}</span>
              </div>
              <div className="detail-row">
                <span className="detail-row-label">Source</span>
                <span className="detail-row-value">{{ cold: 'Cold outreach', referral: 'Référence', inbound: 'Inbound' }[deal.source]}</span>
              </div>
              <div className="detail-row">
                <span className="detail-row-label">Jours dans le stade</span>
                <span className="detail-row-value mono">{deal.days}j</span>
              </div>
              <div className="detail-row">
                <span className="detail-row-label">Tags</span>
                <span className="detail-row-value">{deal.tags.join(', ')}</span>
              </div>
            </div>

            {/* Note */}
            <div className="detail-section">
              <div className="detail-section-label">Note</div>
              <textarea
                className="note-area"
                defaultValue={deal.note}
                placeholder="Ajouter une note…"
              />
            </div>

            {/* Timeline */}
            <div className="detail-section">
              <div className="detail-section-label">Historique</div>
              {TIMELINE_SAMPLE.map((t, i) => (
                <div key={i} className="timeline-item">
                  <div className="timeline-dot" />
                  <div style={{ flex: 1 }}>
                    <div className="timeline-date">{t.date}</div>
                    <div className="timeline-text">{t.text}</div>
                  </div>
                </div>
              ))}
            </div>

            {/* Actions */}
            <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
              <button className="btn" style={{ flex: 1 }}>Planifier</button>
              <button className="btn btn-primary" style={{ flex: 1 }}>Avancer →</button>
            </div>
          </div>
        </div>
      );
    }

    // ─── App ────────────────────────────────────────────────────────────────
    function App() {
      const [deals] = useState(DEALS_INIT);
      const [selectedDeal, setSelectedDeal] = useState(null);
      const [ownerFilter, setOwnerFilter] = useState('all');
      const [sourceFilter, setSourceFilter] = useState('all');

      const filtered = useMemo(() => {
        return deals.filter(d => {
          if (ownerFilter !== 'all' && d.owner !== ownerFilter) return false;
          if (sourceFilter !== 'all' && d.source !== sourceFilter) return false;
          return true;
        });
      }, [deals, ownerFilter, sourceFilter]);

      const totalPipeline = filtered.reduce((s, d) => s + d.value, 0);
      const weighted = filtered.reduce((s, d) => s + Math.round(d.value * d.prob / 100), 0);
      const avgDays = filtered.length
        ? Math.round(filtered.reduce((s, d) => s + d.days, 0) / filtered.length)
        : 0;
      const closingDeals = filtered.filter(d => d.stage === 'closing');
      const closingVal = closingDeals.reduce((s, d) => s + d.value, 0);

      const handleSelect = (deal) => {
        setSelectedDeal(prev => prev?.id === deal.id ? null : deal);
      };

      const owners = ['all', ...Array.from(new Set(DEALS_INIT.map(d => d.owner)))];
      const sources = ['all', 'cold', 'referral', 'inbound'];
      const srcLabels = { all: 'Toutes sources', cold: 'Cold', referral: 'Référence', inbound: 'Inbound' };
      const ownerLabels = { all: 'Tous' };

      return (
        <div id="app">
          {/* Topbar */}
          <div className="topbar">
            <div className="topbar-logo">Eqxia</div>
            <div className="topbar-sep" />
            <div className="topbar-title">Pipeline Commercial</div>
            <div className="topbar-actions">
              <button className="btn">Exporter</button>
              <button className="btn btn-primary">+ Opportunité</button>
            </div>
          </div>

          {/* Stats */}
          <div className="stats-bar">
            <div className="stat-cell">
              <div className="stat-label">Pipeline total</div>
              <div className="stat-value stat-teal">{fmtK(totalPipeline)}</div>
              <div className="stat-sub">{filtered.length} opportunités</div>
            </div>
            <div className="stat-cell">
              <div className="stat-label">Pipeline pondéré</div>
              <div className="stat-value">{fmtK(weighted)}</div>
              <div className="stat-sub">prob. ×  valeur</div>
            </div>
            <div className="stat-cell">
              <div className="stat-label">En Closing</div>
              <div className="stat-value">{fmtK(closingVal)}</div>
              <div className="stat-sub">{closingDeals.length} dossier{closingDeals.length > 1 ? 's' : ''}</div>
            </div>
            <div className="stat-cell">
              <div className="stat-label">Durée moy. / stade</div>
              <div className="stat-value">{avgDays}j</div>
              <div className="stat-sub">tous stades</div>
            </div>
            <div className="stat-cell" style={{ marginLeft: 'auto', minWidth: 'auto' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                {STAGES.map((s, i) => {
                  const stageDeals = filtered.filter(d => d.stage === s.id);
                  const pct = filtered.length ? Math.round(stageDeals.length / filtered.length * 100) : 0;
                  return (
                    <div key={s.id} style={{ textAlign: 'center' }}>
                      <div style={{
                        height: 28, width: 36,
                        background: s.color,
                        opacity: 0.15 + (i / STAGES.length) * 0.85,
                        marginBottom: 3
                      }} />
                      <div style={{ fontSize: 9, fontFamily: 'JetBrains Mono', color: '#53585F' }}>{pct}%</div>
                    </div>
                  );
                })}
              </div>
              <div className="stat-label" style={{ marginTop: 4 }}>Répartition par stade</div>
            </div>
          </div>

          {/* Filters */}
          <div className="filters-bar">
            <span style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.12em', textTransform: 'uppercase', color: '#53585F', marginRight: 4 }}>Owner</span>
            {owners.map(o => (
              <button
                key={o}
                className={`filter-tag ${ownerFilter === o ? 'active' : ''}`}
                onClick={() => setOwnerFilter(o)}
              >{ownerLabels[o] || o}</button>
            ))}
            <div className="filters-sep" />
            <span style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.12em', textTransform: 'uppercase', color: '#53585F', marginRight: 4 }}>Source</span>
            {sources.map(s => (
              <button
                key={s}
                className={`filter-tag ${sourceFilter === s ? 'teal-active' : ''}`}
                onClick={() => setSourceFilter(s)}
              >{srcLabels[s]}</button>
            ))}
          </div>

          {/* Kanban */}
          <div className="kanban-wrap">
            <div className="kanban">
              {STAGES.map(stage => (
                <StageColumn
                  key={stage.id}
                  stage={stage}
                  deals={filtered.filter(d => d.stage === stage.id)}
                  selectedId={selectedDeal?.id}
                  onSelect={handleSelect}
                  totalPipeline={totalPipeline}
                />
              ))}
            </div>

            {/* Detail panel */}
            {selectedDeal && (
              <DetailPanel
                deal={selectedDeal}
                onClose={() => setSelectedDeal(null)}
              />
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
